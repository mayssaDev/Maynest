function t(key) { return TRANSLATIONS[currentLang]?.[key] || TRANSLATIONS['es'][key] || key; }

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('maynest-lang', lang);
  // Update header subtitle
  document.querySelector('.header-sub').textContent =
    lang === 'fr' ? 'GESTION LOCATIVE · 5 CHAMBRES' :
    lang === 'en' ? 'RENTAL MANAGEMENT · 5 ROOMS' :
    'GESTIÓN DE ALQUILER · 5 HABITACIONES';
  // Update nav buttons
  const tabs = ['dashboard','rooms','tenants','payments','deposits','facturas','cleaning','calendar'];
  document.querySelectorAll('.nav-btn').forEach((b,i) => { b.textContent = t(tabs[i]); });
  closeModal();
  // Re-render current tab
  renderTab(currentTab);
  updateFreeBadges();
}

function openSettings() {
  const langs = [
    { code: 'es', badge: 'ES', label: 'Español' },
    { code: 'en', badge: 'EN', label: 'English' },
    { code: 'fr', badge: 'FR', label: 'Français' },
  ];
  openModal(t('settings'), `
    <p style="font-size:11px;font-family:monospace;color:#8a9ab5;letter-spacing:0.1em;margin-bottom:12px">${t('language')}</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${langs.map(l => `
        <div onclick="setLang('${l.code}')" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:${currentLang===l.code?'#1A2B4A':'#F8FAFD'};border-radius:10px;cursor:pointer;border:0.5px solid ${currentLang===l.code?'#1A2B4A':'#B5D4F4'}">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-size:11px;font-family:monospace;background:${currentLang===l.code?'rgba(255,255,255,0.15)':'#1A2B4A18'};color:${currentLang===l.code?'#fff':'#1A2B4A'};padding:3px 7px;border-radius:6px;font-weight:500">${l.badge}</span>
            <span style="font-size:13px;font-weight:500;color:${currentLang===l.code?'#fff':'#1A2B4A'}">${l.label}</span>
          </div>
          ${currentLang===l.code ? `<span style="color:#D4A843;font-size:13px">✓</span>` : ''}

function showTab(tab) {
  document.querySelectorAll('.nav-btn').forEach((b,i) => {
    b.classList.toggle('active', ['dashboard','rooms','tenants','payments','deposits','facturas','cleaning','calendar'][i] === tab);
  });
  document.querySelectorAll('.main > div').forEach(d => d.classList.add('hidden'));
  document.getElementById('tab-' + tab).classList.remove('hidden');
  currentTab = tab;
  renderTab(tab);
}
function renderTab(tab) {
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'rooms') renderRooms();
  if (tab === 'tenants') renderTenants();
  if (tab === 'payments') renderPayments();
  if (tab === 'deposits') renderDeposits();
  if (tab === 'facturas') renderFacturas();
  if (tab === 'cleaning') renderCleaning();
  if (tab === 'calendar') renderCalendar();
}
function roomById(id) { return ROOMS.find(r => r.id === id); }
function fmtDate(d) { if (!d) return '—'; const [y,m,day] = d.split('-'); return `${day}/${m}/${y}`; }
function daysUntil(d) { if (!d) return null; return Math.ceil((new Date(d) - new Date()) / 86400000); }
function getWeek() { const d = new Date(); return Math.ceil(((d - new Date(d.getFullYear(),0,1))/86400000 + new Date(d.getFullYear(),0,1).getDay()+1)/7); }
function currentMonth() { return new Date().toISOString().slice(0,7); }
function activeTenants() { return tenants.filter(t => t.status !== 'ended' && t.status !== 'archived'); }
function badge(label, color) { return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${label}</span>`; }
function statusBadge(s) {
  const map = { active:[t('active'),'#2E7D8C'], leaving:[t('leaving'),'#D4A843'], ended:[t('ended'),'#5B7FA6'], archived:[t('archived')||'Archived','#8a9ab5'] };
  const item = map[s]||[s,'#5B7FA6'];
  return badge(item[0], item[1]);
}
function payBadge(s) {
  const map = { paid:[t('paid'),'#2E7D8C'], late:[t('late'),'#7D2340'], pending:[t('pending'),'#D4A843'] };
  const item = map[s]||[t('pending'),'#D4A843'];
  return badge(item[0], item[1]);
}
function depBadge(s) {
  const map = { held:[t('held'),'#1A2B4A'], returned:[t('returned'),'#2E7D8C'], partial:[t('partial'),'#D4A843'] };
  const item = map[s]||[t('held'),'#1A2B4A'];
  return badge(item[0], item[1]);
}
function getDb() { return window.db; }
function getCol() { return window.dbFns.collection; }
function getDoc() { return window.dbFns.doc; }
function getSet() { return window.dbFns.setDoc; }
function getDel() { return window.dbFns.deleteDoc; }
function getSnap() { return window.dbFns.onSnapshot; }

async function saveTenant(t) { await getSet()(getDoc()(getDb(),'tenants',t.id), t); }
async function archiveTenant(id) {
  const t = tenants.find(x => x.id === id);
  if (!t) return;
  // On archive seulement — on ne supprime JAMAIS les données
  await saveTenant({ ...t, status: 'archived' });
  closeModal();
  renderTab(currentTab);
  updateFreeBadges();
}
async function savePayment(p) { await getSet()(getDoc()(getDb(),'payments',p.id), p); }
async function saveDeposit(d) { await getSet()(getDoc()(getDb(),'deposits',d.tenantId), d); }
async function saveCleaning(c) { await getSet()(getDoc()(getDb(),'cleaning','data'), c); }
async function saveDocuments(tenantId, files) { await getSet()(getDoc()(getDb(),'documents',tenantId), { files }); }
async function saveFactura(f) { await getSet()(getDoc()(getDb(),'facturas',f.id), f); }
async function deleteFactura(id) { await getDel()(getDoc()(getDb(),'facturas',id)); }

function loadData(onTenantsReady) {
  const db = getDb(), onSnapshot = getSnap(), collection = getCol();
  let tenantsLoaded = false;
  onSnapshot(collection(db,'tenants'), snap => {
    tenants = snap.docs.map(d => d.data());
    renderTab(currentTab);
    updateFreeBadges();
    if (!tenantsLoaded && onTenantsReady) { tenantsLoaded = true; onTenantsReady(); }
  });
  onSnapshot(collection(db,'payments'), snap => {
    payments = snap.docs.map(d => d.data()).filter(p => p.tenantId && tenants.some(t => t.id === p.tenantId));
    renderTab(currentTab);
  });
  onSnapshot(collection(db,'deposits'), snap => {
    deposits = snap.docs.map(d => d.data());
    renderTab(currentTab);
  });
  onSnapshot(collection(db,'cleaning'), snap => {
    snap.docs.forEach(d => { if (d.id === 'data') cleaning = d.data(); });
    if (currentTab === 'cleaning') renderCleaning();
  });
  onSnapshot(collection(db,'documents'), snap => {
    documents = {};
    snap.docs.forEach(d => { documents[d.id] = d.data().files || []; });
    if (currentTab === 'tenants') renderTenants();
  });
  onSnapshot(collection(db,'facturas'), snap => {
    facturas = snap.docs.map(d => d.data());
    if (currentTab === 'facturas') renderFacturas();
  });
}

function updateFreeBadges() {
  const occupied = activeTenants().map(t => t.room);
  const free = ROOMS.filter(r => !occupied.includes(r.id));
  const freeLabel = currentLang === 'fr' ? 'libre' : currentLang === 'en' ? 'free' : 'libre';
  document.getElementById('free-badges').innerHTML = `
    <div style="display:flex;flex-direction:row;gap:4px;align-items:center;flex-wrap:nowrap">
      ${free.length > 0 ? `<span style="font-size:9px;color:#C9A96E;font-family:monospace;white-space:nowrap;margin-right:3px">${free.length} ${freeLabel}</span>` : ''}
      ${free.map(r => `<span style="font-size:9px;color:#FAF6F1;border:1px solid rgba(255,255,255,0.3);border-radius:4px;padding:2px 5px;font-family:monospace;white-space:nowrap">${r.name.replace("Habitación","H.").replace("Room","R.").replace("Chambre","Ch.")}</span>`).join('')}
    </div>`;
}

function renderDashboard() {
  const active = activeTenants();
  const totalRev = active.reduce((s,t) => s + (t.rent||0), 0);
  const mon = currentMonth();
  const paidAmt = payments.filter(p => p.month===mon && p.status==='paid').reduce((s,p) => s+(p.amount||0), 0);
  const late = payments.filter(p => {
    const t = tenants.find(x => x.id===p.tenantId);
    return p.month===mon && p.status==='late' && t && t.status!=='ended';
  });
  const exits = tenants.filter(t => t.exitDate && daysUntil(t.exitDate)<=60 && t.status!=='ended');

  let html = `<h1 class="page-title">Panel principal</h1>

    </div>
    <div class="kpi-card" style="border:0.5px solid #B5D4F4;border-left:4px solid #2E7D8C">

    </div>
    <div class="kpi-card" style="border:0.5px solid #B5D4F4;border-left:4px solid #D4A843">
      <i class="ti ti-door" style="font-size:20px;color:#D4A843"></i>
      <div class="kpi-value" style="color:#9A7520">${active.length} / 5</div>
      <div class="kpi-label">${t("occupied")}</div>
    </div>
    <div class="kpi-card" style="border:0.5px solid #B5D4F4;border-left:4px solid #7D2340">
      <i class="ti ti-clock-exclamation" style="font-size:20px;color:#7D2340"></i>
      <div class="kpi-value" style="color:#7D2340">${late.length}</div>
      <div class="kpi-label">${t("delayed")}</div>
    </div>
  </div>`;

  if (late.length > 0 || exits.length > 0) {
    html += `<div class="section-title">${t("alerts")}</div>`;
    late.forEach(p => {
      const t = tenants.find(x => x.id===p.tenantId);
      if (!t) return;
      const r = roomById(t.room);
      html += `<div class="alert" style="background:var(--color-red)11;border:1px solid var(--color-red)44">
        <span style="color:var(--color-red);font-size:0.88rem">⚠ ${t("lateAlert")} — <strong>${t.name}</strong> · ${r?.name||''}</span>
        <span style="color:var(--color-red);font-family:monospace;font-size:0.82rem">${p.amount||0} €</span>
      </div>`;
    });
    exits.forEach(t => {
      const d = daysUntil(t.exitDate);
      html += `<div class="alert" style="background:var(--color-primary)11;border:1px solid var(--color-primary)44">
        <span style="color:var(--color-primary);font-size:0.88rem">◷ ${t("exitAlert")} — <strong>${t.name}</strong></span>
        <span style="color:var(--color-primary);font-family:monospace;font-size:0.82rem">en ${d}j</span>
      </div>`;
    });
  }

  const ADRESSE = "Calle de las Flores, 12, Almería, España";
  const MAPS_EMBED = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3178.5!2d-2.4637!3d36.8403!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd7a9c3b3b3b3b3b%3A0x0!2zQWxtZXLDrWE!5e0!3m2!1sfr!2ses!4v1234567890";
  html += `<div class="section-title" style="margin-top:1.5rem">${t("location")}</div>
  <div class="card" style="padding:0;overflow:hidden">
    <div style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid #B5D4F4">
      <div style="display:flex;align-items:center;gap:10px">
        <i class="ti ti-map-pin" style="font-size:20px;color:#1A2B4A"></i>
        <div>
          <div style="font-weight:600;font-size:0.85rem;color:#1A2B4A">${ADRESSE}</div>
          <div style="font-size:0.72rem;color:#5B7FA6;font-family:monospace">${t("myApartment")}</div>

  </div>`;

}

    html += `<div style="background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px;border:0.5px solid #B5D4F4">
      <div style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid #B5D4F4;background:#F8FAFD">

        <div style="display:flex;align-items:center;gap:6px">

          <button onclick="deleteFacturaConfirm('${f.id}')" style="background:transparent;border:none;cursor:pointer;color:#7D2340"><i class="ti ti-trash" style="font-size:14px"></i></button>

            ? `<span style="font-size:10px;background:#2E7D8C18;color:#2E7D8C;padding:2px 8px;border-radius:10px;font-family:monospace">Pagado</span>`

        <span style="font-size:10px;color:${allPaid?'#2E7D8C':'#7D2340'};font-family:monospace;font-weight:600">${allPaid?'✓ Completo':'Pendiente: '+(f.amount-totalCobrado).toFixed(0)+' €'}</span>
      </div>
    </div>`;
  });

  document.getElementById('tab-facturas').innerHTML = html;
}

function openNewFactura() {
  openModal('Nueva factura', `
    <div class="form-group"><label class="form-label">Tipo</label>
      <select class="form-select" id="fac-type">
        <option value="electricidad">⚡ Electricidad</option>
        <option value="agua">💧 Agua</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Mes (AAAA-MM)</label>
      <input class="form-input" id="fac-month" value="${currentMonth()}">
    </div>
    <div class="form-group"><label class="form-label">Importe total (€)</label>
      <input class="form-input" type="number" id="fac-amount" placeholder="Ex: 120">
    </div>
    <div style="display:flex;gap:0.8rem;justify-content:flex-end;margin-top:0.5rem">
      <button class="btn btn-outline-y" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveNewFactura()">Guardar</button>
    </div>`);
}

async function saveNewFactura() {
  const type = document.getElementById('fac-type').value;
  const month = document.getElementById('fac-month').value;
  const amount = Number(document.getElementById('fac-amount').value);
  if (!amount || !month) return alert('Rellena todos los campos');
  const id = `fac_${type}_${month}_${Date.now()}`;
  const f = { id, type, month, amount, pagos: [] };
  await saveFactura(f);
  facturaFilter = type;
  closeModal();
}

async function pagarFactura(facturaId, tenantId) {
  const f = facturas.find(x => x.id===facturaId);
  if (!f) return;
  const pagos = [...(f.pagos||[])];
  const idx = pagos.findIndex(p => p.tenantId===tenantId);
  if (idx >= 0) pagos[idx] = { ...pagos[idx], status:'paid' };
  else pagos.push({ tenantId, status:'paid' });
  await saveFactura({ ...f, pagos });
}

function deleteFacturaConfirm(id) {
  const f = facturas.find(x => x.id===id);
  const label = f?.type==='electricidad' ? 'Electricidad' : 'Agua';
  openModal('Eliminar factura', `
    <p style="color:#1A2B4A;margin-bottom:1.5rem;font-size:0.9rem;line-height:1.6">¿Eliminar factura <strong>${label} ${f?.month}</strong>? Esta acción es irreversible.</p>
    <div style="display:flex;gap:0.8rem;justify-content:flex-end">
      <button class="btn btn-outline-y" onclick="closeModal()">Cancelar</button>
      <button class="btn" style="background:var(--color-red);color:#fff;border-color:var(--color-red)" onclick="deleteFactura('${id}');closeModal()">Eliminar</button>
    </div>`);
}

function renderCleaning() {
  const week = getWeek() + cleanWeekOffset;
  const label = cleanWeekOffset===0 ? 'Esta semana' : cleanWeekOffset===1 ? 'Semana próxima' : cleanWeekOffset===-1 ? 'Semana pasada' : `Sem. ${cleanWeekOffset>0?'+':''}${cleanWeekOffset}`;
  const active = activeTenants();
  const zones = Object.keys(CLEAN_TASKS);
  const zoneColors = ['var(--color-orange)','var(--color-purple)'];
  const zoneIcons = ['🍳','🛋️'];
  let html = `<h1 class="page-title">Calendario de Limpieza</h1>
  <p style="font-size:0.82rem;color:var(--color-text-muted);font-family:monospace;margin-bottom:1.2rem">Rotación semanal — Cocina y Salón</p>
  <div style="display:flex;gap:0.5rem;margin-bottom:1.5rem;align-items:center">
    <button onclick="cleanWeekOffset--;renderCleaning()" style="background:var(--color-card);border:1px solid var(--color-border);color:#aaa;border-radius:8px;padding:0.4rem 0.9rem;cursor:pointer;font-family:monospace">‹</button>
    <div style="flex:1;text-align:center;font-family:monospace;font-size:0.85rem;color:var(--color-primary);background:var(--color-card);border:1px solid var(--color-border);border-radius:8px;padding:0.4rem">${label} <span style="color:#444">(sem. ${week})</span></div>
    <button onclick="cleanWeekOffset++;renderCleaning()" style="background:var(--color-card);border:1px solid var(--color-border);color:#aaa;border-radius:8px;padding:0.4rem 0.9rem;cursor:pointer;font-family:monospace">›</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem;margin-bottom:1.5rem">`;
  zones.forEach((zone, zi) => {
    const color = zoneColors[zi];
    const tasks = CLEAN_TASKS[zone];
    const assigned = active.length ? active[(week+zi)%active.length] : null;
    const ar = assigned ? roomById(assigned.room) : null;
    const doneTasks = tasks.filter(t => cleaning[`${zone}-${week}-${t}`]).length;
    const allDone = doneTasks === tasks.length;
    html += `<div class="room-card" style="border:1px solid ${color}44"><div class="room-bar" style="background:${color}"></div><div class="room-body">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem"><div style="font-size:1.05rem;font-weight:700;color:${color}">${zoneIcons[zi]} ${zone}</div>${allDone ? badge('✓ Terminado','var(--color-green)') : ''}</div>`;
    if (assigned) {
      html += `<div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.8rem">
        <div class="tenant-avatar" style="width:28px;height:28px;background:${ar?.color}33;border:1.5px solid ${ar?.color};color:${ar?.color};font-size:0.85rem">${assigned.name[0]}</div>
        <div><div style="font-weight:600;font-size:0.9rem">${assigned.name}</div><div style="font-size:0.72rem;color:var(--color-text-muted);font-family:monospace">${ar?.name||'—'}</div></div>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="background:${color};width:${(doneTasks/tasks.length)*100}%"></div></div>`;
      tasks.forEach(task => {
        const done = cleaning[`${zone}-${week}-${task}`];
        html += `<div class="task-item" style="background:${done?color+'11':'transparent'}" onclick="toggleTask('${zone}','${week}','${task}')">
          <div class="task-check" style="border-color:${done?color:'#333'};background:${done?color:'transparent'}">${done?`<span style="color:#111;font-size:0.65rem;font-weight:900">✓</span>`:''}</div>
          <span style="font-size:0.82rem;color:${done?color:'#888'};text-decoration:${done?'line-through':'none'}">${task}</span>
        </div>`;
      });
      html += `<div style="margin-top:0.7rem;font-size:0.72rem;color:#444;font-family:monospace">${doneTasks}/${tasks.length} tareas completadas</div>`;
    } else {
      html += `<div style="font-size:0.82rem;color:#444;font-style:italic">Sin inquilinos activos</div>`;
    }
    html += `</div></div>`;
  });
  html += `</div>`;
  document.getElementById('tab-cleaning').innerHTML = html;
}

async function toggleTask(zone, week, task) {
  const key = `${zone}-${week}-${task}`;
  cleaning[key] = !cleaning[key];
  await saveCleaning(cleaning);
  renderCleaning();
}

function renderCalendar() {
  let html = `<h1 class="page-title">Calendario Entradas / Salidas</h1>`;
  const sorted = [...tenants].sort((a,b) => new Date(a.entryDate)-new Date(b.entryDate));
  sorted.forEach(t => {
    const r = roomById(t.room);
    const d = daysUntil(t.exitDate);
    const exitColor = d!==null&&d<=30 ? 'var(--color-red)' : d!==null&&d<=60 ? 'var(--color-primary)' : 'var(--color-text-muted)';
    html += `<div class="card" style="display:flex;gap:1rem;align-items:center">
      <div style="width:4px;border-radius:4px;align-self:stretch;background:${r?.color};flex-shrink:0"></div>
      <div style="flex:1">
        <div style="font-weight:600;margin-bottom:0.3rem">${t.name} <span style="font-weight:400;color:${r?.color};font-size:0.85rem">· ${r?.name||'—'}</span></div>
        <div style="display:flex;gap:1.5rem;flex-wrap:wrap">
          <span style="font-size:0.82rem;color:var(--color-green);font-family:monospace">↓ Entrada: ${fmtDate(t.entryDate)}</span>
          <span style="font-size:0.82rem;color:${exitColor};font-family:monospace">↑ Salida: ${fmtDate(t.exitDate)}${d!==null?` (${d>0?`en ${d}j`:d===0?'hoy':'vencido'})`:''}
          </span>
        </div>
      </div>
      ${statusBadge(t.status)}
    </div>`;
  });
  if (!tenants.length) html += `<div style="text-align:center;color:var(--color-text-muted);padding:3rem;font-family:monospace">${t("noTenantsReg")}</div>`;
  document.getElementById('tab-calendar').innerHTML = html;
}

async function saveTenantForm(oldId, isEdit) {
  const name = document.getElementById('f-name').value.trim();
  if (!name) return alert('El nombre es obligatorio');
  const id = isEdit ? oldId : 't_'+Date.now();
  const t = { id, name, room: document.getElementById('f-room').value, phone: document.getElementById('f-phone').value, email: document.getElementById('f-email').value, entryDate: document.getElementById('f-entry').value, exitDate: document.getElementById('f-exit').value, rent: Number(document.getElementById('f-rent').value), status: document.getElementById('f-status').value, notes: document.getElementById('f-notes').value };
  await saveTenant(t);
  if (!isEdit) await saveDeposit({ tenantId: id, advance: t.rent, advanceStatus:'held', advancePaidDate:'', fianza: t.rent, fianzaStatus:'held', fianzaPaidDate:'', notes:'' });
  closeModal();
}

async function uploadDoc(tenantId, input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 1.5*1024*1024) { alert('Máximo 1.5 MB'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    const existing = documents[tenantId]||[];
    const newDoc = { id:'d_'+Date.now(), name:file.name, type:file.type, size:file.size, date:new Date().toLocaleDateString('es-ES'), data:e.target.result };
    const updated = [...existing, newDoc];
    documents[tenantId] = updated;
    await saveDocuments(tenantId, updated);
    renderTenants();
  };
  reader.readAsDataURL(file);
  input.value='';
}
function viewDoc(tenantId, docId) {
  const doc = (documents[tenantId]||[]).find(d => d.id===docId);
  if (!doc) return;
  const win = window.open('');
  if (doc.type && doc.type.startsWith('image/')) win.document.write(`<html><body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh"><img src="${doc.data}" style="max-width:100%;max-height:100vh"></body></html>`);
  else win.document.write(`<html><body style="margin:0"><embed src="${doc.data}" width="100%" height="100%" style="position:fixed;inset:0"></body></html>`);
}
function downloadDoc(tenantId, docId) {
  const doc = (documents[tenantId]||[]).find(d => d.id===docId);
  if (!doc) return;
  const a = document.createElement('a'); a.href=doc.data; a.download=doc.name; a.click();
}
async function deleteDoc(tenantId, docId) {
  if (!confirm('¿Eliminar este documento?')) return;
  const docs = (documents[tenantId]||[]).filter(d => d.id!==docId);
  documents[tenantId] = docs;
  await saveDocuments(tenantId, docs);
  renderTenants();
}
function confirmDelete(id) {
  const ten = tenants.find(x => x.id===id);
  openModal(t('archiveTitle'), `
    <p style="color:#1A2B4A;margin-bottom:0.8rem;font-size:0.9rem;line-height:1.6">${t('archive')} <strong>${ten?.name||''}</strong> ?</p>

    </div>`);
}
