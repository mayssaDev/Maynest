<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>MayNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MayNest">
  <style>
    :root {
      --bg: #EEF2F8;
      --card: #FFFFFF;
      --border: #D8E5F4;
      --navy: #1A2B4A;
      --gold: #C9A96E;
      --teal: #2E7D8C;
      --crimson: #7D2340;
      --purple: #2E508C;
      --amber: #D4A843;
      --text: #042C53;
      --muted: #6B87A8;
      --p1: #7D2340; --p2: #1A2B4A; --p3: #2E508C; --p4: #D4A843; --p5: #2E7D8C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }

    /* ── LOADING ── */
    #loading { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1.2rem; z-index: 9999; }
    .spinner { width: 44px; height: 44px; border: 3px solid rgba(201,169,110,0.25); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── HEADER ── */
    .header {
      background: var(--navy);
      padding: 0.6rem 1rem 0.6rem;
      padding-top: calc(0.6rem + env(safe-area-inset-top));
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 2px 16px rgba(26,43,74,0.4);
      min-height: 56px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600; font-style: italic; color: #FAF6F1; letter-spacing: 0.04em; }
    .header-sub { font-size: 0.58rem; color: var(--gold); font-family: monospace; letter-spacing: 0.1em; margin-top: 1px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: rgba(255,255,255,0.08); border: none; border-radius: 8px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: rgba(255,255,255,0.8); flex-shrink: 0; }
    .icon-btn:active { background: rgba(255,255,255,0.15); }

    /* ── FREE BADGES ── */
    #header-free { display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden; max-width: 160px; }
    .hbadge { font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.25); white-space: nowrap; }
    .hbadge.free-count { color: var(--gold); border-color: var(--gold); }

    /* ── TOP NAV (scroll) ── */
    .top-nav {
      display: flex; overflow-x: auto; scrollbar-width: none;
      background: var(--navy);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0 0.5rem;
      position: sticky; top: 56px; z-index: 99;
    }
    .top-nav::-webkit-scrollbar { display: none; }
    .tnav-btn {
      flex: 0 0 auto; padding: 0.65rem 1rem;
      background: none; border: none; border-bottom: 2px solid transparent;
      color: rgba(255,255,255,0.5); cursor: pointer; font-size: 0.7rem; font-family: monospace;
      white-space: nowrap; transition: color 0.15s; letter-spacing: 0.05em;
      display: flex; align-items: center; gap: 5px;
    }
    .tnav-btn i { font-size: 14px; }
    .tnav-btn.active { color: #fff; border-bottom-color: var(--gold); }

    /* ── MAIN CONTENT ── */
    .main { padding: 1rem 1rem 2rem; max-width: 680px; margin: 0 auto; }

    /* ── CARDS ── */
    .card { background: var(--card); border: 0.5px solid var(--border); border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 0.75rem; box-shadow: 0 1px 6px rgba(26,43,74,0.05); }
    .card-action { cursor: pointer; transition: box-shadow 0.15s; }
    .card-action:active { box-shadow: 0 4px 16px rgba(26,43,74,0.14); }

    /* ── KPI GRID ── */
    .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 1rem; }
    .kpi { background: var(--card); border-radius: 14px; padding: 0.9rem 1rem; border: 0.5px solid var(--border); box-shadow: 0 1px 6px rgba(26,43,74,0.05); }
    .kpi-icon { font-size: 18px; margin-bottom: 6px; }
    .kpi-val { font-size: 1.35rem; font-weight: 800; line-height: 1.1; }
    .kpi-lbl { font-size: 0.65rem; color: var(--muted); font-family: monospace; margin-top: 3px; }

    /* ── SECTION LABEL ── */
    .sec { font-size: 0.65rem; font-family: monospace; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin: 1.1rem 0 0.5rem; }

    /* ── ALERT STRIP ── */
    .alert-strip { border-radius: 10px; padding: 0.65rem 0.9rem; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }

    /* ── PROGRESS BAR ── */
    .progress-wrap { background: #EEF2F8; border-radius: 6px; height: 5px; overflow: hidden; margin: 0.4rem 0; }
    .progress-fill { height: 100%; border-radius: 6px; transition: width 0.4s; }

    /* ── BADGE ── */
    .badge { font-size: 0.65rem; padding: 0.15rem 0.5rem; border-radius: 20px; font-family: monospace; white-space: nowrap; display: inline-block; font-weight: 600; }

    /* ── AVATAR ── */
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: 700; flex-shrink: 0; }

    /* ── BUTTONS ── */
    .btn { padding: 0.55rem 1.1rem; border-radius: 20px; font-size: 0.82rem; font-weight: 700; cursor: pointer; font-family: monospace; letter-spacing: 0.03em; border: 1.5px solid; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; }
    .btn-sm { padding: 0.3rem 0.75rem; font-size: 0.72rem; border-radius: 20px; font-weight: 700; cursor: pointer; font-family: monospace; border: 1.5px solid; display: inline-flex; align-items: center; gap: 4px; }
    .btn-navy { background: var(--navy); color: #fff; border-color: var(--navy); }
    .btn-teal { background: var(--teal); color: #fff; border-color: var(--teal); }
    .btn-ghost { background: transparent; color: var(--navy); border-color: var(--border); }
    .btn-ghost-r { background: transparent; color: var(--crimson); border-color: rgba(125,35,64,0.3); }
    .btn:active { opacity: 0.8; }

    /* ── FORM ── */
    .form-group { margin-bottom: 0.9rem; }
    .form-label { display: block; color: var(--muted); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.35rem; font-family: monospace; }
    .form-input, .form-select, .form-textarea { width: 100%; background: #F4F7FC; border: 1.5px solid var(--border); border-radius: 10px; padding: 0.6rem 0.85rem; color: var(--text); font-size: 0.95rem; outline: none; font-family: inherit; transition: border-color 0.15s; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--navy); background: #fff; box-shadow: 0 0 0 3px rgba(26,43,74,0.08); }
    .form-textarea { resize: vertical; min-height: 70px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }

    /* ── MODAL ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(10,20,45,0.65); backdrop-filter: blur(5px); z-index: 1000; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
    @media (min-width: 500px) { .modal-overlay { align-items: center; padding: 1rem; } }
    .modal-box { background: #fff; border-radius: 20px 20px 0 0; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding: 1.5rem 1.3rem 2rem; box-shadow: 0 -10px 40px rgba(26,43,74,0.2); }
    @media (min-width: 500px) { .modal-box { border-radius: 20px; } }
    .modal-handle { width: 36px; height: 4px; background: #d8e0ec; border-radius: 2px; margin: 0 auto 1.2rem; }
    @media (min-width: 500px) { .modal-handle { display: none; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
    .modal-title { font-size: 0.72rem; font-weight: 700; color: var(--navy); font-family: monospace; letter-spacing: 0.1em; text-transform: uppercase; }
    .modal-close { background: #EEF2F8; border: none; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); font-size: 1rem; }

    /* ── TENANT CARD ── */
    .tenant-card { background: var(--card); border: 0.5px solid var(--border); border-radius: 14px; margin-bottom: 0.75rem; overflow: hidden; box-shadow: 0 1px 6px rgba(26,43,74,0.05); }
    .tenant-main { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
    .tenant-info { flex: 1; min-width: 0; }
    .tenant-name { font-weight: 700; font-size: 15px; color: var(--navy); }
    .tenant-sub { font-size: 11px; color: var(--muted); font-family: monospace; margin-top: 2px; }
    .tenant-actions { display: flex; gap: 6px; padding: 8px 14px 10px; flex-wrap: wrap; border-top: 0.5px solid #F0F4FA; background: #FAFCFF; }

    /* ── ROOM SECTION ── */
    .room-block { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 10px; border: 0.5px solid var(--border); box-shadow: 0 1px 6px rgba(26,43,74,0.05); }
    .room-header { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid #F0F4FA; }
    .room-beds { display: grid; gap: 8px; padding: 10px 14px 12px; }
    .bed-card { border-radius: 10px; padding: 10px 12px; border: 0.5px solid; }
    .bed-free { border-style: dashed; background: #FAFCFF; }

    /* ── PAYMENT ROW ── */
    .pay-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid #F0F4FA; }
    .pay-row:last-child { border-bottom: none; }

    /* ── WHATSAPP ── */
    .wa-btn { background: #25D366; color: #fff; border: none; border-radius: 20px; padding: 0.5rem 1rem; font-size: 0.8rem; font-weight: 700; cursor: pointer; font-family: monospace; display: inline-flex; align-items: center; gap: 5px; }

    /* ── TASK ITEM ── */
    .task-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.12s; }
    .task-item:active { background: rgba(0,0,0,0.04); }
    .task-check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #ccc; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .hidden { display: none !important; }
    .page-title { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; font-style: italic; color: var(--navy); margin-bottom: 1rem; }
  </style>
</head>

// HELPERS
// ═══════════════════════════════════════
function roomById(id){ return ROOMS.find(r=>r.id===id); }
function pieceById(id){ return PIECES.find(p=>p.id===id); }
function fmtDate(d){ if(!d) return '—'; const[y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }
function daysUntil(d){ if(!d) return null; return Math.ceil((new Date(d)-new Date())/86400000); }
function getWeek(){ const d=new Date(); return Math.ceil(((d-new Date(d.getFullYear(),0,1))/86400000+new Date(d.getFullYear(),0,1).getDay()+1)/7); }
function currentMonth(){ return new Date().toISOString().slice(0,7); }
function activeTenants(){ return tenants.filter(t=>t.status!=='ended'&&t.status!=='archived'); }

function badge(label, color, bg){
  const b = bg||color+'22';
  return `<span class="badge" style="background:${b};color:${color};border:1px solid ${color}44">${label}</span>`;
}
function statusBadge(s){
  const m={active:[t('active'),'#2E7D8C'],leaving:[t('leaving'),'#D4A843'],ended:[t('ended'),'#8a9ab5'],archived:[t('archived'),'#aaa']};
  const[l,c]=m[s]||[s,'#8a9ab5']; return badge(l,c);
}
function payBadge(s){
  const m={paid:[t('paid'),'#2E7D8C'],late:[t('late'),'#7D2340'],pending:[t('pending'),'#D4A843']};
  const[l,c]=m[s]||[t('pending'),'#D4A843']; return badge(l,c);
}
function depBadge(s){
  const m={held:[t('held'),'#1A2B4A'],returned:[t('returned'),'#2E7D8C'],partial:[t('partial'),'#D4A843']};
  const[l,c]=m[s]||[t('held'),'#1A2B4A']; return badge(l,c);
}
function localeDate(){ return currentLang==='en'?'en-US':currentLang==='fr'?'fr-FR':'es-ES'; }

function getDb(){ return window.db; }
const F = ()=>window.dbFns;
async function saveTenant(ten){ await F().setDoc(F().doc(getDb(),'tenants',ten.id), ten); }
async function archiveTenant(id){
  const ten=tenants.find(x=>x.id===id); if(!ten) return;
  await saveTenant({...ten, status:'archived'});
  closeModal(); renderTab(currentTab); updateFreeBadges();
}
async function savePayment(p){ await F().setDoc(F().doc(getDb(),'payments',p.id), p); }
async function saveDeposit(d){ await F().setDoc(F().doc(getDb(),'deposits',d.tenantId), d); }
async function saveCleaning(c){ await F().setDoc(F().doc(getDb(),'cleaning','data'), c); }
async function saveDocuments(tid, files){ await F().setDoc(F().doc(getDb(),'documents',tid), {files}); }
async function saveFactura(f){ await F().setDoc(F().doc(getDb(),'facturas',f.id), f); }
async function deleteFactura(id){ await F().deleteDoc(F().doc(getDb(),'facturas',id)); }

function loadData(){
  const db=getDb(), {onSnapshot,collection}=F();
  onSnapshot(collection(db,'tenants'), snap=>{
    tenants=snap.docs.map(d=>d.data());
    renderTab(currentTab); updateFreeBadges();
  });
  onSnapshot(collection(db,'payments'), snap=>{
    payments=snap.docs.map(d=>d.data()).filter(p=>p.tenantId);
    renderTab(currentTab);
  });
  onSnapshot(collection(db,'deposits'), snap=>{
    deposits=snap.docs.map(d=>d.data());
    if(currentTab==='deposits') renderDeposits();
  });
  onSnapshot(collection(db,'cleaning'), snap=>{
    snap.docs.forEach(d=>{ if(d.id==='data') cleaning=d.data(); });
    if(currentTab==='cleaning') renderCleaning();
  });
  onSnapshot(collection(db,'documents'), snap=>{
    documents={};
    snap.docs.forEach(d=>{ documents[d.id]=d.data().files||[]; });
    if(currentTab==='tenants') renderTenants();
  });
  onSnapshot(collection(db,'facturas'), snap=>{
    facturas=snap.docs.map(d=>d.data());
    if(currentTab==='facturas') renderFacturas();
  });
}

const ALL_TABS = ['dashboard','rooms','tenants','payments','deposits','facturas','cleaning','calendar'];

function showTab(tab){
  currentTab = tab;
  // Update top nav
  ALL_TABS.forEach(id=>{
    document.getElementById('tnav-'+id)?.classList.toggle('active', id===tab);
  });
  // Show/hide tab panels
  document.querySelectorAll('.main>div').forEach(d=>d.classList.add('hidden'));
  document.getElementById('tab-'+tab)?.classList.remove('hidden');
  renderTab(tab);
}

function renderTab(tab){
  if(tab==='dashboard') renderDashboard();
  if(tab==='rooms') renderRooms();
  if(tab==='tenants') renderTenants();
  if(tab==='payments') renderPayments();
  if(tab==='deposits') renderDeposits();
  if(tab==='facturas') renderFacturas();
  if(tab==='cleaning') renderCleaning();
  if(tab==='calendar') renderCalendar();
}

function updateFreeBadges(){
  const occupied = activeTenants().map(t=>t.room);
  const free = ROOMS.filter(r=>!occupied.includes(r.id));
  const el = document.getElementById('header-free');
  if(!el) return;
  if(free.length===0){ el.innerHTML=''; return; }
  el.innerHTML = `<span class="hbadge free-count">${free.length} libre${free.length>1?'s':''}</span>`;
}

  const labels = {
    fr:{dashboard:'Panel',rooms:'Lits',tenants:'Locataires',payments:'Paiements',deposits:'Garanties',facturas:'Factures',cleaning:'Nettoyage',calendar:'Calendrier'},
    es:{dashboard:'Panel',rooms:'Camas',tenants:'Inquilinos',payments:'Pagos',deposits:'Garantías',facturas:'Facturas',cleaning:'Limpieza',calendar:'Calendario'},
    en:{dashboard:'Panel',rooms:'Beds',tenants:'Tenants',payments:'Payments',deposits:'Deposits',facturas:'Bills',cleaning:'Cleaning',calendar:'Calendar'},
  };
  ALL_TABS.forEach(id=>{
    const btn=document.getElementById('tnav-'+id);
    if(btn){ const icon=btn.querySelector('i'); btn.textContent=''; if(icon) btn.appendChild(icon); btn.append(labels[currentLang][id]); }

}

            ${statusBadge(ten.status)}

          </div>
        </div>
        <button style="background:transparent;border:0.5px solid var(--border);border-radius:8px;padding:5px 7px;cursor:pointer" onclick="openEditTenant('${ten.id}')">

        <button class="btn-sm" style="background:#D4A84318;color:#9A7520;border-color:#D4A84344;border-radius:20px" onclick="openDeposit('${ten.id}')"><i class="ti ti-shield"></i> ${t('fianza')}</button>
        <button class="btn-sm" style="background:#2E508C18;color:#2E508C;border-color:#2E508C44;border-radius:20px" onclick="openEtatLieux('${ten.id}')"><i class="ti ti-home-check"></i></button>
        <button class="btn-sm" style="background:#25D36618;color:#1a9c4a;border-color:#25D36644;border-radius:20px" onclick="openWhatsApp('${ten.id}')"><i class="ti ti-brand-whatsapp"></i></button>
        <button class="btn-sm" style="background:#7D234011;color:#7D2340;border-color:#7D234033;border-radius:20px" onclick="confirmDelete('${ten.id}')"><i class="ti ti-archive"></i></button>

          <label style="cursor:pointer;background:#1A2B4A;color:#fff;border-radius:20px;padding:3px 10px;font-size:10px;font-family:monospace;font-weight:700">+<input type="file" style="display:none" accept="*/*" onchange="uploadDoc('${ten.id}',this)"></label>

  document.getElementById('tab-tenants').innerHTML = html;
}

// ═══════════════════════════════════════
// PAYMENTS
// ═══════════════════════════════════════
function renderPayments(){
  const mon = currentMonth();
  const months = [...new Set([mon,...payments.map(p=>p.month).filter(Boolean)])].sort().reverse().slice(0,4);
  let html = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
    <h1 class="page-title" style="margin:0">${t('payments')}</h1>
  </div>`;

  months.forEach(month=>{
    const[y,m]=month.split('-');
    const label=new Date(y,m-1).toLocaleDateString(localeDate(),{month:'long',year:'numeric'});
    const monthPays=payments.filter(p=>p.month===month);
    const paidAmt=monthPays.filter(p=>p.status==='paid').reduce((s,p)=>s+(p.amount||0),0);
    const active=activeTenants();
    const paidCount=monthPays.filter(p=>p.status==='paid').length;
    const totalRev=active.reduce((s,t)=>s+(t.rent||0),0);
    const pct=active.length?Math.round((paidCount/active.length)*100):0;
    const isCurrent=month===mon;

    html += `<div class="card" style="${isCurrent?'border-left:3px solid #1A2B4A':''};margin-bottom:0.75rem">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-size:13px;font-weight:700;color:#1A2B4A;text-transform:capitalize">${label}</div>
        <div style="font-size:11px;font-family:monospace;color:${pct===100?'#2E7D8C':'#8a9ab5'}">${paidCount}/${active.length} · ${paidAmt} €</div>
      </div>
      <div class="progress-wrap" style="margin-bottom:0.9rem">
        <div class="progress-fill" style="background:${pct===100?'#2E7D8C':'#1A2B4A'};width:${pct}%"></div>
      </div>`;

    active.forEach((ten,i)=>{
      const r=roomById(ten.room);
      const p=monthPays.find(x=>x.tenantId===ten.id);
      const isLast=i===active.length-1;
      html += `<div class="pay-row" style="${isLast?'border-bottom:none':''}">
        <div style="width:28px;height:28px;border-radius:50%;background:${r?.color}20;border:1.5px solid ${r?.color};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:${r?.color};flex-shrink:0">${ten.name?.[0]||'?'}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:#1A2B4A;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ten.name}</div>
          <div style="font-size:10px;color:#8a9ab5;font-family:monospace">${r?.shortName||'—'}</div>
        </div>
        <div style="font-family:monospace;font-size:12px;font-weight:700;color:#1A2B4A;flex-shrink:0">${ten.rent||0} €</div>
        <div style="flex-shrink:0;display:flex;gap:5px;align-items:center">
          ${p ? payBadge(p.status) : `<span style="font-size:10px;color:#8a9ab5;font-family:monospace;border:1px solid #ddd;padding:2px 7px;border-radius:10px">—</span>`}
          ${(!p||p.status!=='paid') ? `<button onclick="quickPay('${ten.id}','${month}')" style="background:#2E7D8C;color:#fff;border:none;border-radius:20px;padding:3px 10px;font-size:10px;font-family:monospace;cursor:pointer;font-weight:700">✓</button>` : `<button onclick="openPayment('${ten.id}')" style="background:transparent;border:0.5px solid var(--border);border-radius:8px;padding:3px 6px;cursor:pointer"><i class="ti ti-edit" style="font-size:11px;color:#8a9ab5"></i></button>`}
        </div>
      </div>`;
    });

    html += `</div>`;
  });

  document.getElementById('tab-payments').innerHTML = html;
}

  const filtered=facturas.filter(f=>f.type===facturaFilter).sort((a,b)=>b.month.localeCompare(a.month));
  const active=activeTenants();

  let html = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
    <h1 class="page-title" style="margin:0">${t('facturas')}</h1>
    <button class="btn btn-navy btn-sm" onclick="openNewFactura()">+ ${currentLang==='fr'?'Facture':currentLang==='en'?'Bill':'Factura'}</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:1rem">
    <button onclick="facturaFilter='electricidad';renderFacturas()" style="flex:1;background:${facturaFilter==='electricidad'?'#1A2B4A':'#fff'};color:${facturaFilter==='electricidad'?'#fff':'#1A2B4A'};border:1.5px solid #1A2B4A;border-radius:20px;padding:9px 12px;font-size:12px;font-family:monospace;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px">
      <i class="ti ti-bolt" style="font-size:14px"></i> Électricité
    </button>
    <button onclick="facturaFilter='agua';renderFacturas()" style="flex:1;background:${facturaFilter==='agua'?'#2E7D8C':'#fff'};color:${facturaFilter==='agua'?'#fff':'#2E7D8C'};border:1.5px solid #2E7D8C;border-radius:20px;padding:9px 12px;font-size:12px;font-family:monospace;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px">
      <i class="ti ti-droplet" style="font-size:14px"></i> Eau
    </button>
  </div>`;

  if(!filtered.length){
    html+=`<div style="text-align:center;color:#8a9ab5;padding:3rem;font-family:monospace">${t('noFacturas')}</div>`;
  }

  filtered.forEach(f=>{
    const[y,m]=f.month.split('-');
    const label=new Date(y,m-1).toLocaleDateString(localeDate(),{month:'long',year:'numeric'});
    const parPerson=active.length?Math.round(f.amount/active.length*100)/100:0;
    const pagados=(f.pagos||[]).filter(p=>p.status==='paid').length;
    const allPaid=pagados===active.length&&active.length>0;
    const color=f.type==='electricidad'?'#D4A843':'#2E7D8C';
    const icon=f.type==='electricidad'?'ti-bolt':'ti-droplet';

    html+=`<div class="card" style="padding:0;overflow:hidden;margin-bottom:0.75rem">
      <div style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid #F0F4FA;background:#FAFCFF">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:34px;height:34px;border-radius:10px;background:${color}18;display:flex;align-items:center;justify-content:center">
            <i class="ti ${icon}" style="font-size:18px;color:${color}"></i>
          </div>
          <div>
            <div style="font-weight:700;font-size:13px;color:#1A2B4A;text-transform:capitalize">${label}</div>
            <div style="font-size:10px;color:#8a9ab5;font-family:monospace">${f.amount} € total · ${parPerson} € / personne</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:5px">
          <span style="font-size:10px;background:${allPaid?'#2E7D8C18':'#F0F4FA'};color:${allPaid?'#2E7D8C':'#8a9ab5'};padding:2px 8px;border-radius:10px;font-family:monospace">${pagados}/${active.length}</span>
          <button onclick="deleteFacturaConfirm('${f.id}')" style="background:transparent;border:none;cursor:pointer;color:#7D2340;padding:3px"><i class="ti ti-trash" style="font-size:14px"></i></button>
        </div>
      </div>
      <div style="padding:4px 14px 8px">`;

    active.forEach((ten,i)=>{
      const r=roomById(ten.room);
      const pago=(f.pagos||[]).find(p=>p.tenantId===ten.id);
      const isPaid=pago?.status==='paid';
      const isLast=i===active.length-1;
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;${isLast?'':'border-bottom:0.5px solid #F5F7FB'}">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:26px;height:26px;border-radius:50%;background:${r?.color}20;border:1px solid ${r?.color};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:${r?.color}">${ten.name[0]}</div>
          <span style="font-size:12px;color:#1A2B4A;font-weight:600">${ten.name.split(' ')[0]}</span>
        </div>
        <div style="display:flex;align-items:center;gap:5px">
          <span style="font-size:12px;font-weight:700;color:#1A2B4A;font-family:monospace">${parPerson} €</span>
          ${isPaid
            ? `<span style="font-size:10px;background:#2E7D8C18;color:#2E7D8C;padding:2px 8px;border-radius:10px;font-family:monospace">✓ Payé</span>`
            : `<button onclick="pagarFactura('${f.id}','${ten.id}')" style="background:#2E7D8C;color:#fff;border:none;border-radius:20px;padding:3px 10px;font-size:10px;font-family:monospace;cursor:pointer;font-weight:700">✓</button>`}
        </div>
      </div>`;
    });

    html+=`</div>
      <div style="padding:7px 14px;background:${allPaid?'#2E7D8C15':'#F4F7FC'};border-top:0.5px solid #F0F4FA;display:flex;justify-content:space-between">

// CLEANING
// ═══════════════════════════════════════
function renderCleaning(){
  const week=getWeek()+cleanWeekOffset;
  const lbl=cleanWeekOffset===0?'Cette semaine':cleanWeekOffset===1?'Sem. prochaine':cleanWeekOffset===-1?'Sem. dernière':`Sem. ${cleanWeekOffset>0?'+':''}${cleanWeekOffset}`;
  const active=activeTenants();
  const zones=Object.keys(CLEAN_TASKS);
  const colors=['#D4A843','#2E508C'];
  const icons=['🍳','🛋️'];

  let html = `
  <h1 class="page-title">${t('cleanTitle')}</h1>
  <div style="display:flex;gap:8px;margin-bottom:1rem;align-items:center">
    <button onclick="cleanWeekOffset--;renderCleaning()" style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:7px 13px;cursor:pointer;font-family:monospace;font-size:16px;color:#1A2B4A">‹</button>
    <div style="flex:1;text-align:center;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px;font-family:monospace;font-size:12px;color:#1A2B4A;font-weight:600">${lbl} · Sem. ${week}</div>
    <button onclick="cleanWeekOffset++;renderCleaning()" style="background:#fff;border:1px solid var(--border);border-radius:10px;padding:7px 13px;cursor:pointer;font-family:monospace;font-size:16px;color:#1A2B4A">›</button>
  </div>`;

  zones.forEach((zone,zi)=>{
    const color=colors[zi];
    const tasks=CLEAN_TASKS[zone];
    const assigned=active.length?active[(week+zi)%active.length]:null;
    const ar=assigned?roomById(assigned.room):null;
    const done=tasks.filter(t=>cleaning[`${zone}-${week}-${t}`]).length;
    const allDone=done===tasks.length&&tasks.length>0;

    html+=`<div class="card" style="padding:0;overflow:hidden;margin-bottom:0.75rem">
      <div style="height:3px;background:${color}"></div>
      <div style="padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-size:14px;font-weight:700;color:${color}">${icons[zi]} ${zone}</div>
          ${allDone?badge('✓ Terminé','#2E7D8C'):''}
        </div>
        ${assigned?`
          <div style="display:flex;align-items:center;gap:8px;padding:8px;background:#F4F7FC;border-radius:10px;margin-bottom:10px">
            <div style="width:32px;height:32px;border-radius:50%;background:${ar?.color}20;border:1.5px solid ${ar?.color};display:flex;align-items:center;justify-content:center;font-weight:700;color:${ar?.color};font-size:13px">${assigned.name[0]}</div>
            <div>
              <div style="font-size:13px;font-weight:700;color:#1A2B4A">${assigned.name}</div>
              <div style="font-size:10px;color:#8a9ab5;font-family:monospace">${ar?.shortName||'—'}</div>
            </div>
          </div>
          <div class="progress-wrap">
            <div class="progress-fill" style="background:${color};width:${tasks.length?Math.round(done/tasks.length*100):0}%"></div>
          </div>
          <div style="font-size:10px;color:#8a9ab5;font-family:monospace;margin-bottom:8px">${done}/${tasks.length} tâches</div>
          ${tasks.map(task=>{
            const isDone=cleaning[`${zone}-${week}-${task}`];
            return `<div class="task-item" style="background:${isDone?color+'15':'transparent'}" onclick="toggleTask('${zone}','${week}','${task}')">
              <div class="task-check" style="border-color:${isDone?color:'#ccc'};background:${isDone?color:'transparent'}">
                ${isDone?`<i class="ti ti-check" style="color:#fff;font-size:11px"></i>`:''}
              </div>
              <span style="font-size:12px;color:${isDone?color:'#5B7FA6'};text-decoration:${isDone?'line-through':'none'}">${task}</span>
            </div>`;
          }).join('')}
        `:`<div style="font-size:12px;color:#8a9ab5;font-style:italic;padding:8px 0">${t('noActiveTenants')}</div>`}
      </div>
    </div>`;
  });

  document.getElementById('tab-cleaning').innerHTML = html;
}

function renderCalendar(){

async function uploadDoc(tenantId, input){
  const file=input.files[0]; if(!file) return;
  if(file.size>1.5*1024*1024){ alert('Max 1.5 MB'); input.value=''; return; }
  const reader=new FileReader();
  reader.onload=async(e)=>{
    const existing=documents[tenantId]||[];
    const newDoc={id:'d_'+Date.now(),name:file.name,type:file.type,size:file.size,date:new Date().toLocaleDateString(localeDate()),data:e.target.result};
    const updated=[...existing,newDoc];
    documents[tenantId]=updated;
    await saveDocuments(tenantId,updated);
    renderTenants();
  };
  reader.readAsDataURL(file);
  input.value='';
}
function viewDoc(tenantId, docId){
  const doc=(documents[tenantId]||[]).find(d=>d.id===docId); if(!doc) return;
  const win=window.open('');
  if(doc.type?.startsWith('image/')) win.document.write(`<html><body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh"><img src="${doc.data}" style="max-width:100%;max-height:100vh"></body></html>`);
  else win.document.write(`<html><body style="margin:0"><embed src="${doc.data}" width="100%" height="100%" style="position:fixed;inset:0"></body></html>`);
}
function downloadDoc(tenantId, docId){
  const doc=(documents[tenantId]||[]).find(d=>d.id===docId); if(!doc) return;
  const a=document.createElement('a'); a.href=doc.data; a.download=doc.name; a.click();
}
async function deleteDoc(tenantId, docId){
  if(!confirm('Supprimer ce document ?')) return;
  const docs=(documents[tenantId]||[]).filter(d=>d.id!==docId);
  documents[tenantId]=docs;
  await saveDocuments(tenantId,docs);
  renderTenants();
}

function openModal(title, body){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
function handleOverlayClick(e){ if(e.target.id==='modal') closeModal(); }
