  <!-- ============================================ -->
  <style>
    :root {
      --color-bg:        #EEF2F8;   /* Fond bleu clair */
      --color-card:      #FFFFFF;   /* Fond des cartes */
      --color-border:    #B5D4F4;   /* Bordures bleues */
      --color-primary:   #1A2B4A;   /* Bleu nuit principal */
      --color-green:     #2E7D8C;   /* Bleu pétrole (succès) */
      --color-red:       #7D2340;   /* Bordeaux (alerte) */
      --color-purple:    #2E508C;   /* Bleu marine */
      --color-orange:    #D4A843;   /* Or/Champagne */
      --color-text:      #042C53;   /* Texte principal */
      --color-text-muted:#5B7FA6;   /* Texte secondaire */

      /* Couleurs des 5 chambres */
      --room1: #7D2340;
      --room2: #1A2B4A;
      --room3: #2E508C;
      --room4: #D4A843;
      --room5: #2E7D8C;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #EEF2F8;
      color: #042C53;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ---- PAGE TITLE ---- */
    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      font-style: italic;
      margin-bottom: 1.5rem;
      color: #0C447C;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* ---- HEADER ---- */
    .header {
      background: #1A2B4A;
      border-bottom: none;
      padding: 0.7rem 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(26,43,74,0.35);
      min-height: 60px;
      gap: 0.5rem;
    }
    .header-title {
      font-size: 1.2rem;
      font-weight: 600;
      font-style: italic;
      color: #FAF6F1;
      letter-spacing: 0.06em;
      font-family: 'Cormorant Garamond', Georgia, serif;
      white-space: nowrap;
    }
    .header-sub {
      font-size: 0.6rem;
      color: #C9A96E;
      font-family: monospace;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .header-logo-wrapper {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      flex-shrink: 0;
    }
    .header-text-wrapper {
      border-left: 2px solid #C9A96E;
      padding-left: 0.7rem;
    }
    .free-badges {
      display: flex;
      gap: 0.3rem;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 50%;
    }
    .free-badge {
      font-size: 0.6rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      background: transparent;
      color: #FAF6F1;
      border: 1px solid rgba(255,255,255,0.4);
      white-space: nowrap;
    }

    /* ---- NAV ---- */
    .nav {
      display: flex;
      border-bottom: 1.5px solid #c5d4e8;
      overflow-x: auto;
      scrollbar-width: none;
      background: #FFFFFF;
      box-shadow: 0 2px 8px rgba(26,43,74,0.06);
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav-btn {
      flex: 0 0 auto;
      padding: 0.85rem 1rem;
      background: none;
      border: none;
      border-bottom: 2.5px solid transparent;
      color: #8a9ab5;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: monospace;
      letter-spacing: 0.04em;
      white-space: nowrap;
      transition: color 0.15s;
    }
    .nav-btn.active {
      color: #1A2B4A;
      border-bottom-color: #C9A96E;
      font-weight: 700;
    }

    /* ---- MAIN ---- */
    .main { padding: 1.5rem; max-width: 900px; margin: 0 auto; }

    /* ---- CARDS ---- */
    .card {
      background: #FFFFFF;
      border: 0.5px solid #B5D4F4;
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 0.8rem;
      box-shadow: 0 2px 8px rgba(26,43,74,0.06);
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(26,43,74,0.12); }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.7rem;
      margin-bottom: 1.5rem;
    }
    .kpi-card {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 0.8rem 1rem;
      border: 0.5px solid #B5D4F4;
      box-shadow: 0 2px 8px rgba(26,43,74,0.06);
    }
    .kpi-value {
      font-size: 1.2rem;
      font-weight: 700;
      margin: 0.25rem 0 0.15rem;
    }
    .kpi-label {
      font-size: 0.68rem;
      color: var(--color-text-muted);
      font-family: monospace;
    }

    /* ---- BUTTONS ---- */
    .btn {
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: monospace;
      letter-spacing: 0.04em;
      border: 1.5px solid;
      transition: all 0.15s;
    }
    .btn-sm {
      padding: 0.35rem 0.8rem;
      font-size: 0.8rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-family: monospace;
      border: 1.5px solid;
    }
    .btn-primary   { background: #1A2B4A; color: #ffffff; border-color: #1A2B4A; border-radius: 20px; }
    .btn-green     { background: var(--color-green); color: #fff; border-color: var(--color-green); border-radius: 20px; }
    .btn-outline-y { background: transparent; color: #1A2B4A; border-color: #1A2B4A; border-radius: 20px; }
    .btn-outline-g { background: transparent; color: var(--color-green); border-color: var(--color-green); border-radius: 20px; }
    .btn-outline-r { background: transparent; color: var(--color-red); border-color: var(--color-red); border-radius: 20px; }
    .btn-outline-p { background: transparent; color: var(--color-purple); border-color: var(--color-purple); border-radius: 20px; }
    .btn-outline-o { background: transparent; color: #BA7517; border-color: #EF9F27; border-radius: 20px; }

    /* ---- BADGES ---- */
    .badge {
      font-size: 0.72rem;
      padding: 0.18rem 0.55rem;
      border-radius: 20px;
      font-family: monospace;
      white-space: nowrap;
      display: inline-block;
    }

    /* ---- SECTION TITLE ---- */
    .section-title {
      font-size: 0.75rem;
      font-family: monospace;
      color: #8a9ab5;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      margin-top: 0.2rem;
    }

    /* ---- PAGE TITLE ---- */
    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      font-style: italic;
      margin-bottom: 1.5rem;
      color: #0C447C;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    /* ---- ALERT ---- */
    .alert {
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ---- MODAL ---- */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(26,43,74,0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-box {
      background: #FFFFFF;
      border: 0.5px solid #B5D4F4;
      border-radius: 20px;
      width: 100%; max-width: 560px;
      max-height: 90vh; overflow-y: auto;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(26,43,74,0.2);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem;
    }
    .modal-title { font-size: 1.3rem; font-weight: 600; font-style:italic; color: #0C447C; font-family:'Cormorant Garamond',serif; }
    .modal-close {
      background: none; border: none;
      color: #8a9ab5; font-size: 1.5rem; cursor: pointer;
    }

    /* ---- FORM ---- */
    .form-group { margin-bottom: 1rem; }
    .form-label {
      display: block;
      color: #8a9ab5; font-size: 0.78rem;
      letter-spacing: 0.08em; text-transform: uppercase;
      margin-bottom: 0.4rem; font-family: monospace;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: #F8FAFD;
      border: 1.5px solid #B5D4F4;
      border-radius: 10px;
      padding: 0.65rem 0.9rem;
      color: #042C53;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: #1A2B4A;
      box-shadow: 0 0 0 3px rgba(26,43,74,0.1);
    }
    .form-textarea { resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }

    /* ---- ROOM CARDS ---- */
    .room-card {
      background: #FFFFFF;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(26,43,74,0.06);
      transition: box-shadow 0.2s;
    }
    .room-card:hover { box-shadow: 0 6px 20px rgba(26,43,74,0.12); }
    .room-bar { height: 6px; }
    .room-body { padding: 1.2rem; }
    .rooms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
    }

    /* ---- TENANT ROW ---- */
    .tenant-row {
      background: #FFFFFF;
      border: 0.5px solid #B5D4F4;
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 0.8rem;
      box-shadow: 0 2px 8px rgba(26,43,74,0.06);
    }
    .tenant-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 700;
      flex-shrink: 0;
    }

    /* ---- CLEANING ---- */
    .task-item {
      display: flex; align-items: center; gap: 0.6rem;
      cursor: pointer; padding: 0.35rem 0.5rem;
      border-radius: 6px; transition: background 0.15s;
    }
    .task-check {
      width: 16px; height: 16px;
      border-radius: 4px; border: 1.5px solid #333;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s;
    }
    .progress-bar {
      background: #0d0d14; border-radius: 6px;
      height: 6px; margin-bottom: 0.9rem; overflow: hidden;
    }
    .progress-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }

    /* ---- WHATSAPP BTN ---- */
    .whatsapp-btn {
      background: #25D366; color: #111;
      border: none; border-radius: 8px;
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem; font-weight: 700;
      cursor: pointer; font-family: monospace;
      display: flex; align-items: center; gap: 0.5rem;
    }

    /* ---- LOADING ---- */
    #loading {
      position: fixed; inset: 0;
      background: #1A2B4A;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem; z-index: 9999;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(201,169,110,0.3);
      border-top-color: #C9A96E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>

<script>
// ============================================
// CONFIGURATION DES CHAMBRES
// Modifie les noms et couleurs ici
// ============================================
const ROOMS = [
  { id: 'r1', name: 'Chambre 1', color: '#7D2340' },
  { id: 'r2', name: 'Chambre 2', color: '#1A2B4A' },
  { id: 'r3', name: 'Chambre 3', color: '#2E508C' },
  { id: 'r4', name: 'Chambre 4', color: '#D4A843' },
  { id: 'r5', name: 'Chambre 5', color: '#2E7D8C' },
];

const CLEAN_TASKS = {
  'Cuisine': ['Nettoyer les surfaces','Laver la vaisselle commune','Nettoyer le four/micro-ondes','Vider/nettoyer le frigo','Balayer & laver le sol'],
  'Salon':   ['Aspirer/balayer','Dépoussiérer les meubles','Nettoyer les vitres','Vider les poubelles','Ranger les espaces communs'],
};

// ============================================
// DONNÉES EN MÉMOIRE
// ============================================
let tenants  = [];
let payments = [];
let deposits = [];
let cleaning = {};
let documents = {}; // { tenantId: [{id, name, type, size, date, data}] }
let currentTab = 'dashboard';

// ============================================
// NAVIGATION
// ============================================
function showTab(tab) {
  document.querySelectorAll('.nav-btn').forEach((b,i) => {
    b.classList.toggle('active', ['dashboard','rooms','tenants','payments','deposits','cleaning','calendar'][i] === tab);
  });
  document.querySelectorAll('.main > div').forEach(d => d.classList.add('hidden'));
  document.getElementById('tab-' + tab).classList.remove('hidden');
  currentTab = tab;
  renderTab(tab);
}

function renderTab(tab) {
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'rooms')     renderRooms();
  if (tab === 'tenants')   renderTenants();
  if (tab === 'payments')  renderPayments();
  if (tab === 'deposits')  renderDeposits();
  if (tab === 'cleaning')  renderCleaning();
  if (tab === 'calendar')  renderCalendar();
}

// ============================================
// HELPERS
// ============================================
function roomById(id)   { return ROOMS.find(r => r.id === id); }
function fmtDate(d)     { if (!d) return '—'; const [y,m,day] = d.split('-'); return `${day}/${m}/${y}`; }
function daysUntil(d)   { if (!d) return null; return Math.ceil((new Date(d) - new Date()) / 86400000); }
function getWeek()      { const d = new Date(); return Math.ceil(((d - new Date(d.getFullYear(),0,1))/86400000 + new Date(d.getFullYear(),0,1).getDay()+1)/7); }
function currentMonth() { return new Date().toISOString().slice(0,7); }
function activeTenants(){ return tenants.filter(t => t.status !== 'ended'); }

function badge(label, color) {
  return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${label}</span>`;
}

function statusBadge(s) {
  const map = {
    active:  ['Actif',      '#2E7D8C'],
    leaving: ['En départ',  '#D4A843'],
    ended:   ['Terminé',    '#5B7FA6']
  };
  return badge(map[s][0], map[s][1]);
}

function payBadge(s) {
  const map = {
    paid:    ['Payé',        '#2E7D8C'],
    late:    ['En retard',   '#7D2340'],
    pending: ['En attente',  '#D4A843']
  };
  return badge(map[s][0], map[s][1]);
}

function depBadge(s) {
  const map = {
    held:     ['Détenu',  '#1A2B4A'],
    returned: ['Rendu',   '#2E7D8C'],
    partial:  ['Partiel', '#D4A843']
  };
  return badge(map[s][0], map[s][1]);
}

// ============================================
// FIREBASE CRUD
// ============================================
// Firebase functions loaded from window
function getDb()  { return window.db; }
function getCol() { return window.dbFns.collection; }
function getDoc() { return window.dbFns.doc; }
function getSet() { return window.dbFns.setDoc; }
function getDel() { return window.dbFns.deleteDoc; }
function getSnap(){ return window.dbFns.onSnapshot; }

async function saveTenant(t) {
  const db = getDb(); const docFn = getDoc(); const setFn = getSet();
  await setFn(docFn(db, 'tenants', t.id), t);
}
async function deleteTenant(id) {
  const db = getDb(); const docFn = getDoc(); const delFn = getDel();
  await delFn(docFn(db, 'tenants', id));
  deposits = deposits.filter(d => d.tenantId !== id);
  await delFn(docFn(db, 'deposits', id));
  tenants = tenants.filter(t => t.id !== id);
  payments = payments.filter(p => p.tenantId !== id);
  renderTab(currentTab);
  updateFreeBadges();
}
async function savePayment(p) {
  const db = getDb(); const docFn = getDoc(); const setFn = getSet();
  await setFn(docFn(db, 'payments', p.id), p);
}
async function saveDeposit(d) {
  const db = getDb(); const docFn = getDoc(); const setFn = getSet();
  await setFn(docFn(db, 'deposits', d.tenantId), d);
}
async function saveCleaning(c) {
  const db = getDb(); const docFn = getDoc(); const setFn = getSet();
  await setFn(docFn(db, 'cleaning', 'data'), c);
}
async function saveDocuments(tenantId, files) {
  const db = getDb(); const docFn = getDoc(); const setFn = getSet();
  await setFn(docFn(db, 'documents', tenantId), { files });
}

// ============================================
// LOAD DATA
// ============================================
function loadData() {
  const db = getDb();
  const onSnapshot = getSnap();
  const collection = getCol();

  onSnapshot(collection(db,'tenants'), snap => {
    tenants = snap.docs.map(d => d.data());
    renderTab(currentTab);
    updateFreeBadges();
  });
  onSnapshot(collection(db,'payments'), snap => {
    payments = snap.docs.map(d => d.data());
    renderTab(currentTab);
  });
  onSnapshot(collection(db,'deposits'), snap => {
    deposits = snap.docs.map(d => d.data());
    renderTab(currentTab);
  });
  onSnapshot(collection(db,'cleaning'), snap => {
    snap.docs.forEach(d => { if(d.id==='data') cleaning = d.data(); });
    if(currentTab==='cleaning') renderCleaning();
  });
  onSnapshot(collection(db,'documents'), snap => {
    documents = {};
    snap.docs.forEach(d => { documents[d.id] = d.data().files || []; });
    if(currentTab==='tenants') renderTenants();
  });
}

// ============================================
// CLEANING
// ============================================
let cleanWeekOffset = 0;

function renderCleaning() {
  const week = getWeek() + cleanWeekOffset;
  const label = cleanWeekOffset===0 ? 'Cette semaine' : cleanWeekOffset===1 ? 'Semaine prochaine' : cleanWeekOffset===-1 ? 'Semaine dernière' : `Sem. ${cleanWeekOffset>0?'+':''}${cleanWeekOffset}`;
  const active = activeTenants();
  const zones = Object.keys(CLEAN_TASKS);
  const zoneColors = ['var(--color-orange)','var(--color-purple)'];
  const zoneIcons = ['🍳','🛋️'];

  let html = `<h1 class="page-title">Calendrier de Nettoyage</h1>
  <p style="font-size:0.82rem;color:var(--color-text-muted);font-family:monospace;margin-bottom:1.2rem">Rotation hebdomadaire — Cuisine & Salon</p>
  <div style="display:flex;gap:0.5rem;margin-bottom:1.5rem;align-items:center">
    <button onclick="cleanWeekOffset--;renderCleaning()" style="background:var(--color-card);border:1px solid var(--color-border);color:#aaa;border-radius:8px;padding:0.4rem 0.9rem;cursor:pointer;font-family:monospace">‹</button>
    <div style="flex:1;text-align:center;font-family:monospace;font-size:0.85rem;color:var(--color-primary);background:var(--color-card);border:1px solid var(--color-border);border-radius:8px;padding:0.4rem">
      ${label} <span style="color:#444">(sem. ${week})</span>
    </div>
    <button onclick="cleanWeekOffset++;renderCleaning()" style="background:var(--color-card);border:1px solid var(--color-border);color:#aaa;border-radius:8px;padding:0.4rem 0.9rem;cursor:pointer;font-family:monospace">›</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem;margin-bottom:1.5rem">`;

  zones.forEach((zone, zi) => {
    const color = zoneColors[zi];
    const tasks = CLEAN_TASKS[zone];
    const assigned = active.length ? active[(week + zi) % active.length] : null;
    const ar = assigned ? roomById(assigned.room) : null;
    const doneTasks = tasks.filter(t => cleaning[`${zone}-${week}-${t}`]).length;
    const allDone = doneTasks === tasks.length;

    html += `<div class="room-card" style="border:1px solid ${color}44">
      <div class="room-bar" style="background:${color}"></div>
      <div class="room-body">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem">
          <div style="font-size:1.05rem;font-weight:700;color:${color}">${zoneIcons[zi]} ${zone}</div>
          ${allDone ? badge('✓ Terminé','var(--color-green)') : ''}
        </div>`;
    if (assigned) {
      html += `<div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.8rem">
          <div class="tenant-avatar" style="width:28px;height:28px;background:${ar?.color}33;border:1.5px solid ${ar?.color};color:${ar?.color};font-size:0.85rem">${assigned.name[0]}</div>
          <div>
            <div style="font-weight:600;font-size:0.9rem">${assigned.name}</div>
            <div style="font-size:0.72rem;color:var(--color-text-muted);font-family:monospace">${ar?.name}</div>
          </div>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="background:${color};width:${(doneTasks/tasks.length)*100}%"></div>
        </div>`;
      tasks.forEach(task => {
        const done = cleaning[`${zone}-${week}-${task}`];
        html += `<div class="task-item" style="background:${done?color+'11':'transparent'}" onclick="toggleTask('${zone}','${week}','${task}')">
          <div class="task-check" style="border-color:${done?color:'#333'};background:${done?color:'transparent'}">
            ${done?`<span style="color:#111;font-size:0.65rem;font-weight:900">✓</span>`:''}
          </div>
          <span style="font-size:0.82rem;color:${done?color:'#888'};text-decoration:${done?'line-through':'none'}">${task}</span>
        </div>`;
      });
      html += `<div style="margin-top:0.7rem;font-size:0.72rem;color:#444;font-family:monospace">${doneTasks}/${tasks.length} tâches complétées</div>`;
    } else {
      html += `<div style="font-size:0.82rem;color:#444;font-style:italic">Aucun locataire actif</div>`;
    }
    html += `</div></div>`;
  });

  html += `</div>`;

  // Planning 5 semaines
  html += `<div class="section-title">PLANNING 5 PROCHAINES SEMAINES</div>
  <div style="overflow-x:auto">
  <table style="width:100%;border-collapse:collapse;font-size:0.8rem">
    <thead><tr>
      <th style="text-align:left;padding:0.5rem 0.8rem;font-family:monospace;color:#444;font-size:0.72rem;border-bottom:1px solid var(--color-border)">SEMAINE</th>
      ${zones.map((z,i)=>`<th style="text-align:left;padding:0.5rem 0.8rem;font-family:monospace;color:${zoneColors[i]};font-size:0.72rem;border-bottom:1px solid var(--color-border)">${zoneIcons[i]} ${z.toUpperCase()}</th>`).join('')}
    </tr></thead><tbody>`;

  for(let i=0;i<5;i++) {
    const w = getWeek() + i;
    const lbl = i===0?'Cette sem.':i===1?'Sem. prochaine':`Sem. +${i}`;
    html += `<tr style="background:${i===0?'var(--color-card)':'transparent'}">
      <td style="padding:0.55rem 0.8rem;font-family:monospace;color:${i===0?'var(--color-primary)':'#555'};border-bottom:1px solid #111">${lbl}</td>`;
    zones.forEach((z,zi) => {
      const t = active.length ? active[(w+zi)%active.length] : null;
      const r = t ? roomById(t.room) : null;
      html += `<td style="padding:0.55rem 0.8rem;border-bottom:1px solid #111">
        ${t ? `<span style="display:flex;align-items:center;gap:0.4rem">
          <span style="width:7px;height:7px;border-radius:50%;background:${r?.color};display:inline-block"></span>
          <span style="color:${i===0?'#fff':'#666'}">${t.name.split(' ')[0]}</span>
        </span>` : '—'}
      </td>`;
    });
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;
  document.getElementById('tab-cleaning').innerHTML = html;
}

async function toggleTask(zone, week, task) {
  const key = `${zone}-${week}-${task}`;
  cleaning[key] = !cleaning[key];
  await saveCleaning(cleaning);
  renderCleaning();
}

function renderCalendar() {

  const sorted = [...tenants].sort((a,b) => new Date(a.entryDate)-new Date(b.entryDate));
  sorted.forEach(t => {
    const r = roomById(t.room);
    const d = daysUntil(t.exitDate);
    const exitColor = d!==null && d<=30 ? 'var(--color-red)' : d!==null && d<=60 ? 'var(--color-primary)' : 'var(--color-text-muted)';
    html += `<div class="card" style="display:flex;gap:1rem;align-items:center">
      <div style="width:4px;border-radius:4px;align-self:stretch;background:${r?.color};flex-shrink:0"></div>

        <div style="font-weight:600;margin-bottom:0.3rem">${t.name} <span style="font-weight:400;color:${r?.color};font-size:0.85rem">· ${r?.name}</span></div>
        <div style="display:flex;gap:1.5rem;flex-wrap:wrap">
          <span style="font-size:0.82rem;color:var(--color-green);font-family:monospace">↓ Entrée: ${fmtDate(t.entryDate)}</span>
          <span style="font-size:0.82rem;color:${exitColor};font-family:monospace">
            ↑ Sortie: ${fmtDate(t.exitDate)}${d!==null?` (${d>0?`dans ${d}j`:d===0?"aujourd'hui":'dépassé'})`:''}

function openModal(title, bodyHtml) {

// ADD / EDIT TENANT
function openAddTenant(roomId) {
  openModal('Nouveau locataire', tenantForm({ id: '', name:'', room: roomId||'r1', phone:'', email:'', entryDate:'', exitDate:'', rent:'', status:'active', notes:'', etatLieux:'' }, false));
}
function openEditTenant(id) {
  const t = tenants.find(x => x.id===id);
  if (!t) return;
  openModal('Modifier locataire', tenantForm(t, true));
}

function tenantForm(t, isEdit) {
  const roomOpts = ROOMS.map(r => `<option value="${r.id}" ${t.room===r.id?'selected':''}>${r.name}</option>`).join('');
  const statusOpts = [['active','Actif'],['leaving','En départ'],['ended','Terminé']].map(([v,l])=>`<option value="${v}" ${t.status===v?'selected':''}>${l}</option>`).join('');
  return `
    <div class="form-group"><label class="form-label">Nom complet</label><input class="form-input" id="f-name" value="${t.name}"></div>
    <div class="form-group"><label class="form-label">Chambre</label><select class="form-select" id="f-room">${roomOpts}</select></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Téléphone</label><input class="form-input" id="f-phone" value="${t.phone||''}"></div>
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="f-email" value="${t.email||''}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Date d'entrée</label><input class="form-input" type="date" id="f-entry" value="${t.entryDate||''}"></div>
      <div class="form-group"><label class="form-label">Date de sortie</label><input class="form-input" type="date" id="f-exit" value="${t.exitDate||''}"></div>
    </div>
    <div class="form-group"><label class="form-label">Loyer mensuel (€)</label><input class="form-input" type="number" id="f-rent" value="${t.rent||''}"></div>
    <div class="form-group"><label class="form-label">Statut</label><select class="form-select" id="f-status">${statusOpts}</select></div>
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input form-textarea" id="f-notes">${t.notes||''}</textarea></div>
    <div style="display:flex;gap:0.8rem;justify-content:flex-end;margin-top:0.5rem">
      <button class="btn btn-outline-y" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveTenantForm('${t.id}',${isEdit})">${isEdit?'Mettre à jour':'Enregistrer'}</button>
    </div>`;
}

async function saveTenantForm(oldId, isEdit) {
  const name = document.getElementById('f-name').value.trim();
  if (!name) return alert('Le nom est obligatoire');
  const id = isEdit ? oldId : 't_' + Date.now();
  const t = {
    id, name,
    room:      document.getElementById('f-room').value,
    phone:     document.getElementById('f-phone').value,
    email:     document.getElementById('f-email').value,
    entryDate: document.getElementById('f-entry').value,
    exitDate:  document.getElementById('f-exit').value,
    rent:      Number(document.getElementById('f-rent').value),
    status:    document.getElementById('f-status').value,
    notes:     document.getElementById('f-notes').value,
  };
  await saveTenant(t);
  if (!isEdit) {
    const dep = { tenantId: id, advance: t.rent, advanceStatus:'held', advancePaidDate:'', fianza: t.rent, fianzaStatus:'held', fianzaPaidDate:'', notes:'' };
    await saveDeposit(dep);
  }
  closeModal();
}

// PAYMENT MODAL
function openPayment(tenantId) {
  const t = tenants.find(x => x.id===tenantId);
  const statusOpts = [['paid','Payé'],['late','En retard'],['pending','En attente']].map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  openModal(`Paiement — ${t.name}`, `
    <div class="form-group"><label class="form-label">Mois (AAAA-MM)</label><input class="form-input" id="p-month" value="${currentMonth()}"></div>
    <div class="form-group"><label class="form-label">Montant (€)</label><input class="form-input" type="number" id="p-amount" value="${t.rent}"></div>

      <button class="btn btn-green" onclick="savePaymentForm('${tenantId}')">Enregistrer</button>

async function savePaymentForm(tenantId) {
  const month  = document.getElementById('p-month').value;
  const amount = Number(document.getElementById('p-amount').value);
  const status = document.getElementById('p-status').value;
  const p = { id: `p_${tenantId}_${month}`, tenantId, month, amount, status, date: status==='paid' ? new Date().toISOString().slice(0,10) : null };
  await savePayment(p);
  closeModal();
}

function openDeposit(tenantId) {
  const t = tenants.find(x => x.id===tenantId);
  const d = deposits.find(x => x.tenantId===tenantId) || { tenantId, advance:t.rent, advanceStatus:'held', advancePaidDate:'', fianza:t.rent, fianzaStatus:'held', fianzaPaidDate:'', notes:'' };
  const depOpts = s => [['held','Détenu'],['returned','Rendu'],['partial','Partiel']].map(([v,l])=>`<option value="${v}" ${s===v?'selected':''}>${l}</option>`).join('');
  openModal(`Dépôt & Garantie — ${t.name}`, `
    <div style="background:#0d0d14;border-radius:10px;padding:0.8rem 1rem;margin-bottom:1.2rem;font-size:0.8rem;color:#555;font-family:monospace">
      Loyer de référence : <span style="color:var(--color-primary)">${t.rent} €</span>
    </div>
    <div style="color:var(--color-orange);font-size:0.85rem;font-weight:700;margin-bottom:0.8rem">Mois d'avance</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Montant (€)</label><input class="form-input" type="number" id="d-adv" value="${d.advance}"></div>
      <div class="form-group"><label class="form-label">Date reçu</label><input class="form-input" type="date" id="d-advdate" value="${d.advancePaidDate||''}"></div>
    </div>
    <div class="form-group"><label class="form-label">Statut avance</label><select class="form-select" id="d-advstatus">${depOpts(d.advanceStatus)}</select></div>
    <div style="border-top:1px solid var(--color-border);margin:1rem 0"></div>
    <div style="color:var(--color-primary);font-size:0.85rem;font-weight:700;margin-bottom:0.8rem">Caution</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Montant (€)</label><input class="form-input" type="number" id="d-fia" value="${d.fianza}"></div>
      <div class="form-group"><label class="form-label">Date reçu</label><input class="form-input" type="date" id="d-fiadate" value="${d.fianzaPaidDate||''}"></div>
    </div>
    <div class="form-group"><label class="form-label">Statut fianza</label><select class="form-select" id="d-fiastatus">${depOpts(d.fianzaStatus)}</select></div>
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input form-textarea" id="d-notes">${d.notes||''}</textarea></div>
    <div style="display:flex;gap:0.8rem;justify-content:flex-end;margin-top:0.5rem">
      <button class="btn btn-outline-y" onclick="closeModal()">Annuler</button>
      <button class="btn" style="background:var(--color-orange);color:#111;border-color:var(--color-orange)" onclick="saveDepositForm('${tenantId}')">Enregistrer</button>
    </div>`);
}

async function saveDepositForm(tenantId) {
  const dep = {
    tenantId,
    advance:         Number(document.getElementById('d-adv').value),
    advancePaidDate: document.getElementById('d-advdate').value,
    advanceStatus:   document.getElementById('d-advstatus').value,
    fianza:          Number(document.getElementById('d-fia').value),
    fianzaPaidDate:  document.getElementById('d-fiadate').value,
    fianzaStatus:    document.getElementById('d-fiastatus').value,
    notes:           document.getElementById('d-notes').value,
  };
  await saveDeposit(dep);
  closeModal();
}

// DOCUMENTS
// ============================================
async function uploadDoc(tenantId, input) {
  const file = input.files[0];
  if (!file) return;

  if (file.size > 1.5 * 1024 * 1024) {
    alert('Fichier trop grand ! Maximum 1.5 MB par document.');
    input.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = async (e) => {
    const existing = documents[tenantId] || [];
    const newDoc = {
      id: 'd_' + Date.now(),
      name: file.name,
      type: file.type,
      size: file.size,
      date: new Date().toLocaleDateString('fr-FR'),
      data: e.target.result
    };
    const updated = [...existing, newDoc];
    documents[tenantId] = updated;
    await saveDocuments(tenantId, updated);
    renderTenants();
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function viewDoc(tenantId, docId) {
  const docs = documents[tenantId] || [];
  const doc = docs.find(d => d.id === docId);
  if (!doc) return;
  const win = window.open('');
  if (doc.type && doc.type.startsWith('image/')) {
    win.document.write(`<html><body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh"><img src="${doc.data}" style="max-width:100%;max-height:100vh"></body></html>`);
  } else {
    win.document.write(`<html><body style="margin:0"><embed src="${doc.data}" width="100%" height="100%" style="position:fixed;inset:0"></body></html>`);
  }
}

function downloadDoc(tenantId, docId) {
  const docs = documents[tenantId] || [];
  const doc = docs.find(d => d.id === docId);
  if (!doc) return;
  const a = document.createElement('a');
  a.href = doc.data;
  a.download = doc.name;
  a.click();
}
